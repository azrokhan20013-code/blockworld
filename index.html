<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VICE CITY STORIES — Enhanced Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc9e8;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.panel{background:linear-gradient(135deg,#071421e8,#172b39d9);border:1px solid #ff82a788;border-radius:12px;padding:10px 13px;box-shadow:0 4px 22px #07142155;text-shadow:0 1px 3px #000}
#logo{font-weight:900;letter-spacing:2px;color:#ff9cbd;font-size:14px}small{color:#c3dce9;font-size:9px;letter-spacing:1px}
#stats{text-align:right;font-size:12px;line-height:1.5}#mission{position:fixed;top:78px;left:12px;background:#071421df;border:1px solid #63dfff99;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 4px 20px #07142144}
#controls{position:fixed;bottom:20px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px;gap:5px}
button{background:#071421d9;color:white;border:1px solid #ffffff88;border-radius:13px;font-weight:bold;font-size:18px;touch-action:none;user-select:none;box-shadow:0 3px 10px #0005}
button:active{background:#d84e83}.pad button{width:50px;height:50px}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;flex-direction:column;gap:7px}.actions button{width:82px;height:43px;font-size:10px}
#hint{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;text-shadow:0 1px 4px #000;white-space:nowrap}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101e2a;color:white;z-index:5;font-weight:bold;letter-spacing:2px;transition:opacity .6s}
</style>
</head>
<body>
<div id="loading">LOADING VICE CITY…</div>
<div id="hud"><div class="panel"><div id="logo">VICE CITY STORIES</div><small>ENHANCED CITY EDITION</small></div><div class="panel" id="stats">CASH: $<span id="cash">0</span><br><span id="mode">ON FOOT</span></div></div>
<div id="mission">MISSION 01<br><b>Explore the coastline</b><br>Find the glowing collectibles.</div>
<div id="controls"><div class="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div class="actions"><button id="jump">JUMP</button><button id="enter">ENTER / EXIT</button><button id="gas">GAS ▲</button><button id="brake">BRAKE ▼</button></div></div>
<div id="hint">Move with arrows • Walk close to a car and tap ENTER / EXIT</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9acfe8);
scene.fog=new THREE.FogExp2(0xa8d5e7,.0026);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,700);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x66564a,1.8));
const sun=new THREE.DirectionalLight(0xffe4c2,3.1);sun.position.set(-65,100,55);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-130;sun.shadow.camera.right=130;sun.shadow.camera.top=130;sun.shadow.camera.bottom=-130;sun.shadow.bias=-.00015;scene.add(sun);
const fill=new THREE.DirectionalLight(0xb5dfff,.65);fill.position.set(50,25,-80);scene.add(fill);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const asphalt=mat(0x30343a,.96),concrete=mat(0xbab8ad,.95),grass=mat(0x527d58),sand=mat(0xd9c49a),oceanMat=new THREE.MeshPhysicalMaterial({color:0x168da9,roughness:.23,metalness:.12,clearcoat:.8,clearcoatRoughness:.2});
function addBox(parent,w,h,d,material,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.18;ground.receiveShadow=true;scene.add(ground);
const beach=new THREE.Mesh(new THREE.PlaneGeometry(500,80),sand);beach.rotation.x=-Math.PI/2;beach.position.set(0,-.08,-150);scene.add(beach);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(700,260),oceanMat);ocean.rotation.x=-Math.PI/2;ocean.position.set(0,-.13,-300);scene.add(ocean);

// Procedural road surface with subtle grain and lane markings.
const roadTexCanvas=document.createElement('canvas');roadTexCanvas.width=512;roadTexCanvas.height=512;
const ctx=roadTexCanvas.getContext('2d');ctx.fillStyle='#34383d';ctx.fillRect(0,0,512,512);
for(let i=0;i<15000;i++){let v=35+Math.random()*35;ctx.fillStyle=`rgba(${v},${v},${v},${Math.random()*.18})`;ctx.fillRect(Math.random()*512,Math.random()*512,1+Math.random()*2,1+Math.random()*2)}
const roadTex=new THREE.CanvasTexture(roadTexCanvas);roadTex.wrapS=roadTex.wrapT=THREE.RepeatWrapping;roadTex.repeat.set(8,8);roadTex.colorSpace=THREE.SRGBColorSpace;
const roadMat=new THREE.MeshStandardMaterial({map:roadTex,roughness:.98});
function road(w,d,x,z){let r=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,.005,z);r.receiveShadow=true;scene.add(r)}
for(let i=-3;i<=3;i++){let z=i*48;road(600,15,0,z);let x=i*54;road(15,600,x,0);
 for(let p=-285;p<290;p+=16){addBox(scene,6,.018,.16,mat(0xe5d7a6),p,.025,z);addBox(scene,.16,.018,6,mat(0xe5d7a6),x,.025,p)}
 // sidewalks bordering each street
 addBox(scene,600,.22,2.2,concrete,0,.09,z+8.5);addBox(scene,600,.22,2.2,concrete,0,.09,z-8.5);
 addBox(scene,2.2,.22,600,concrete,x+8.5,.09,0);addBox(scene,2.2,.22,600,concrete,x-8.5,.09,0);
}

// Building facade textures: tinted walls, rows of lit windows and roof details.
const facadeColors=[0xd8b6a0,0xd4c5ad,0x9eb8b8,0xd4a6a9,0xc6c0b2,0xe2c18e,0x9caec0];
const windowMats=[mat(0x426275,.28,.25),mat(0x6c8992,.32,.18),mat(0x293f50,.25,.2)];
function makeBuilding(x,z,w,d,h,index){
 const base=facadeColors[index%facadeColors.length];const wall=mat(base,.86);
 addBox(scene,w,h,d,wall,x,h/2,z);
 // architectural roof parapet
 addBox(scene,w+.35,.65,d+.35,mat(0xe4d7c5),x,h+.25,z);
 // front windows and balcony ledges
 for(let y=3.2;y<h-1.5;y+=3.5)for(let xx=-w/2+2;xx<w/2-1.2;xx+=3.2){
  let wm=windowMats[(Math.floor(xx+y)%3+3)%3];
  addBox(scene,1.55,2.05,.10,wm,x+xx,y,z+d/2+.055);
  addBox(scene,1.72,.12,.22,mat(0xddd1bd),x+xx,y-1.12,z+d/2+.12);
 }
 // side windows
 for(let y=3.2;y<h-1.5;y+=3.5)for(let zz=-d/2+2;zz<d/2-1;zz+=3.2)addBox(scene,.10,2.05,1.5,windowMats[1],x+w/2+.055,y,z+zz);
 // rooftop HVAC units
 for(let k=0;k<2;k++){let unit=addBox(scene,2.2,1.1,1.8,mat(0x777d7d),x+(k-.5)*w*.35,h+.9,z);addBox(scene,2.3,.12,1.9,mat(0x50595d),unit.position.x,h+1.5,z)}
}
let bi=0;
for(let gx=-5;gx<=5;gx++)for(let gz=-5;gz<=4;gz++){
 if(Math.abs(gx)<1&&Math.abs(gz)<1)continue;
 if(gz<-3&&gx>0)continue;
 let x=gx*54+(Math.random()-.5)*5,z=gz*48+(Math.random()-.5)*5;
 let w=19+Math.random()*13,d=18+Math.random()*10,h=14+Math.random()*48;
 makeBuilding(x,z,w,d,h,bi++);
}

// Palm trees, planted beds and street lamps.
function palm(x,z,scale=1){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.25*scale,.42*scale,7*scale,9),mat(0x87603e));trunk.position.set(x,3.5*scale,z);trunk.castShadow=true;scene.add(trunk);
 for(let i=0;i<8;i++){let a=i*Math.PI/4;let leaf=new THREE.Mesh(new THREE.ConeGeometry(.48*scale,5.5*scale,7),mat(i%2?0x28764f:0x36865a));leaf.position.set(x+Math.cos(a)*2.1*scale,6.8*scale,z+Math.sin(a)*2.1*scale);leaf.rotation.z=Math.PI/2.25;leaf.rotation.y=-a;leaf.castShadow=true;scene.add(leaf)}
}
for(let i=0;i<55;i++){let x=(Math.random()-.5)*500,z=(Math.random()-.5)*420;if(Math.abs(x%54)>12&&Math.abs(z%48)>12)palm(x,z,.8+Math.random()*.4)}
function streetLamp(x,z){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,6,8),mat(0x414a50,.5,.65));pole.position.set(x,3,z);scene.add(pole);addBox(scene,1.2,.12,.18,mat(0x414a50),x+.45,5.8,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshStandardMaterial({color:0xffe8b2,emissive:0xffd27a,emissiveIntensity:.7}));bulb.position.set(x+.95,5.65,z);scene.add(bulb)}
for(let i=-5;i<=5;i++)for(let j=-4;j<=4;j++){streetLamp(i*54+11,j*48+11)}

// Player character with clothing, limbs and head.
const player=new THREE.Group();scene.add(player);
const skin=mat(0xb98262),shirt=mat(0xe5e0d5),pants=mat(0x27364a),shoe=mat(0x202328);
addBox(player,.82,.85,.42,shirt,0,1.45,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.29,20,16),skin);head.position.y=2.08;head.castShadow=true;player.add(head);
for(let side of [-1,1]){addBox(player,.22,.8,.25,pants,side*.23,.55,0);addBox(player,.24,.18,.38,shoe,side*.23,.12,.04);let arm=addBox(player,.2,.72,.22,skin,side*.55,1.45,0);arm.rotation.z=side*.12}
player.position.set(0,0,0);

// Detailed stylized sports cars with body, glass, wheels, lights and bumpers.
const cars=[];
function createCar(x,z,color,rotation=0){
 const g=new THREE.Group();scene.add(g);const paint=new THREE.MeshPhysicalMaterial({color,roughness:.24,metalness:.65,clearcoat:1,clearcoatRoughness:.12});
 addBox(g,4.35,.82,2.05,paint,0,.78,0);addBox(g,2.35,.85,1.7,mat(0x263d4b,.16,.25),-.15,1.52,0);
 addBox(g,4.1,.16,2.12,mat(0x171b20,.55,.2),0,.38,0);
 for(let sx of [-1.42,1.42])for(let sz of [-1,1]){let tire=new THREE.Mesh(new THREE.CylinderGeometry(.47,.47,.3,20),mat(0x111418,.95));tire.rotation.x=Math.PI/2;tire.position.set(sx,.47,sz);tire.castShadow=true;g.add(tire);let rim=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.315,16),mat(0xaeb9bf,.25,.8));rim.rotation.x=Math.PI/2;rim.position.copy(tire.position);g.add(rim)}
 for(let sz of [-.72,.72]){addBox(g,.42,.18,.06,mat(0xfff0c8,.25),2.18,.88,sz);addBox(g,.38,.2,.06,mat(0xc72d38,.25),-2.18,.85,sz)}
 addBox(g,4.5,.18,2.18,mat(0x25282b,.5),0,.38,0);
 g.position.set(x,0,z);g.rotation.y=rotation;cars.push(g);return g;
}
createCar(8,7,0xc83f5c);createCar(-18,49,0x287eaa);createCar(105,-38,0xe3b747,.8);createCar(-100,96,0xd9dedb,-.5);createCar(55,145,0x554e8a,1.4);

// Glowing collectibles.
const coins=[];for(let i=0;i<18;i++){let coin=new THREE.Mesh(new THREE.TorusGeometry(.58,.16,10,24),new THREE.MeshStandardMaterial({color:0xffd54a,emissive:0x9c6100,emissiveIntensity:.9,metalness:.5,roughness:.25}));coin.position.set((Math.random()-.5)*210,1.4,(Math.random()-.5)*210);scene.add(coin);coins.push(coin)}

const keys={};function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>keys[key]=false)}
bind('up','forward');bind('down','back');bind('left','left');bind('right','right');bind('gas','forward');bind('brake','back');
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let cash=0,driving=false,activeCar=null,speed=0,vy=0;
document.getElementById('jump').onclick=()=>{if(!driving&&player.position.y<.02)vy=7};
document.getElementById('enter').onclick=()=>{if(!driving){let nearest=[...cars].sort((a,b)=>a.position.distanceTo(player.position)-b.position.distanceTo(player.position))[0];if(nearest&&nearest.position.distanceTo(player.position)<13){activeCar=nearest;driving=true;document.getElementById('mode').textContent='DRIVING'}}else{player.position.copy(activeCar.position);player.position.x+=4;activeCar=null;driving=false;speed=0;document.getElementById('mode').textContent='ON FOOT'}};
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 let f=keys.forward||keys.w||keys.arrowup,b=keys.back||keys.s||keys.arrowdown,l=keys.left||keys.a||keys.arrowleft,r=keys.right||keys.d||keys.arrowright;
 if(driving&&activeCar){if(f)speed=Math.min(speed+15*dt,28);else if(b)speed=Math.max(speed-22*dt,-7);else speed*=.985;if(l)activeCar.rotation.y+=dt*1.35*(speed>=0?1:-1);if(r)activeCar.rotation.y-=dt*1.35*(speed>=0?1:-1);activeCar.translateZ(-speed*dt);let a=activeCar.rotation.y;camera.position.lerp(new THREE.Vector3(activeCar.position.x+Math.sin(a)*10,6.5,activeCar.position.z+Math.cos(a)*10),.08);camera.lookAt(activeCar.position.x,1.1,activeCar.position.z)}
 else{let move=new THREE.Vector3((r?1:0)-(l?1:0),0,(b?1:0)-(f?1:0));if(move.length())move.normalize().multiplyScalar(10*dt);player.position.add(move);if(move.length())player.rotation.y=Math.atan2(move.x,move.z);vy-=18*dt;player.position.y=Math.max(0,player.position.y+vy*dt);if(player.position.y===0)vy=0;camera.position.lerp(new THREE.Vector3(player.position.x+8,6.2,player.position.z+10),.08);camera.lookAt(player.position.x,1.2,player.position.z)}
 const target=driving?activeCar.position:player.position;
 for(const c of coins){c.rotation.y+=dt*1.7;c.position.y=1.4+Math.sin(t*2+c.position.x)*.18;if(c.visible&&c.position.distanceTo(target)<3){c.visible=false;cash+=100;document.getElementById('cash').textContent=cash}}
 renderer.render(scene,camera);
}
camera.position.set(8,6,10);camera.lookAt(0,1,0);animate();
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity='0';setTimeout(()=>l.remove(),650)},900);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
